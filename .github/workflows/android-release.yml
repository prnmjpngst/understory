# Android production build — jalankan di GitHub Actions, bukan mesin lokal.
#
# Menghasilkan APK rilis + AAB, menandatanganinya dengan keystore produksi dari
# rahasia repo, lalu mengunggahnya sebagai artifact. Untuk menghasilkan riwayat
# rilis (Release di GitHub), cukup push tag `v*`.
#
# Rahasia yang perlu disiapkan di repo settings → Secrets and variables:
#   ANDROID_KEYSTORE          — file keystore, di-base64 (base64 < release.keystore)
#   ANDROID_KEYSTORE_PASSWORD — kata sandi keystore
#   ANDROID_KEY_ALIAS         — alias kunci
#   ANDROID_KEY_PASSWORD      — kata sandi kunci
# Jika rahasia belum ada, workflow tetap jalan dan rilis memakai debug keystore.

name: Android Production Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runner image uses ~10GB before we start; a 4-ABI RN release build needs
      # far more. Free space from preinstalled tooling (keep Android SDK + node
      # tool cache). android:false keeps the SDK; tool-cache:true re-downloads node.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Prepare Android SDK (licenses + NDK)
        run: |
          SDKMANAGER="sdkmanager"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.1.12297006" "build-tools;36.0.0" \
            > /dev/null 2>&1 || echo "sdkmanager install skipped (AGP will auto-download)"

      - name: Configure release signing from repo secrets
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "No signing secrets configured — release will use the debug keystore."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > android/release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties
          echo "Release signing configured from repo secrets."

      - name: Build release artifacts
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Rilis hanya untuk ARM (perangkat nyata); x86/x86_64 dipakai emulator lokal.
          ./gradlew assembleRelease bundleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        working-directory: android

      - name: Show outputs
        run: ls -lh android/app/build/outputs/apk/release/ android/app/build/outputs/bundle/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: understory-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: understory-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true